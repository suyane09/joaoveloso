name: Revisão completa VERTEX solicitada pelo João
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revisar-vertex-cliente.yml']
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir textos, preço, WhatsApp e galeria do João
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          original_html=html
          def replace_exact(old,new,expected=1):
              global html
              n=html.count(old)
              if n!=expected:
                  raise RuntimeError(f"Esperado {expected} ocorrência(s), encontrado {n}: {old[:145]}")
              html=html.replace(old,new)
          
          # A identidade tipográfica oficial já está implantada e permanece intacta:
          assert 'assets/brand-fonts.css' in html
          assert Path('assets/fonts/FunnelDisplay-Variable.ttf').is_file()
          assert Path('assets/fonts/PlusJakartaSans-Variable.ttf').is_file()
          
          # Cabeçalho e apresentação do Método VERTEX.
          replace_exact(
              'Método VERTEX: avaliação postural individual e treino sob medida, 100% online, com o João acompanhando cada semana pelo WhatsApp.',
              'Conheça o Método VERTEX: um acompanhamento individualizado para buscar o físico dos seus sonhos, melhorar sua postura, reduzir desconfortos e tornar seu corpo mais funcional. Comigo acompanhando sua evolução pelo WhatsApp.'
          )
          replace_exact('<nav><a href="#metodo">Método</a><a href="#sobre">Sobre</a><a href="#depoimentos">Depoimentos</a><a href="#oferta">Plano</a>',
                        '<nav><a href="#metodo">Método</a><a href="#sobre">Sobre</a><a href="#depoimentos">Depoimentos</a><a href="#oferta">Consultoria</a>')
          replace_exact(
            '<div><b data-to="149" data-pre="R$">R$149</b><span>no Pix ou cartão</span></div>',
            '<div><b>1:1</b><span>acompanhamento personalizado comigo</span></div>'
          )
          
          # Método: linguagem em primeira pessoa, tal como o João solicitou.
          replace_exact('Fotos, medidas e anamnese analisadas pelo João, tudo de forma online.',
                        'Fotos, medidas e anamnese analisadas por mim, de forma online e individual.')
          replace_exact('Todos os dias, a qualquer momento, direto com o João.',
                        'Acompanhamento e orientações comigo, todos os dias pelo WhatsApp.')
          replace_exact('Você envia vídeos pelo WhatsApp e recebe os erros e melhorias apontados.',
                        'Você me envia vídeos pelo WhatsApp, e eu oriento os ajustes para melhorar sua execução.')
          replace_exact('Quer saber se o Método VERTEX é para você? Fale direto com o João.',
                        'Quer saber se o Método VERTEX é para você? Converse comigo pelo WhatsApp.')
          
          # Biografia: remover o trecho sobre ser dono de academia, conforme áudio.
          replace_exact(
            'Sou João Veloso. Cresci dentro de academias, hoje sou profissional de Educação Física e tenho experiência à frente da minha própria academia, com perfis e objetivos bem diferentes.',
            'Sou João Veloso, profissional de Educação Física. Minha atuação une treinamento individualizado, biomecânica e correção postural para ajudar cada aluno a evoluir respeitando sua realidade.'
          )
          
          # Seção da consultoria: não mostrar o preço, nem no HTML nem no link do WhatsApp.
          replace_exact(
            'Um plano único, sem pegadinha: 6 semanas de treino e correção postural com acompanhamento direto.',
            'Conheça o Método VERTEX e descubra como o acompanhamento individualizado pode ajudar você a desenvolver um físico mais simétrico, melhorar sua postura e se movimentar com mais confiança.'
          )
          replace_exact('<span class="tag">Plano único</span><h3>Consultoria Método VERTEX</h3>',
                        '<span class="tag">Acompanhamento individual</span><h3>Consultoria Método VERTEX</h3>')
          replace_exact(
            '<div class="price" style="margin-top:18px"><span>R$</span><b>149</b><small>/ 6 semanas</small></div><p class="six">6 semanas de acompanhamento com treino e correção postural.</p>',
            '<div class="vertex-contact-copy"><strong>Seu próximo passo começa aqui.</strong><span>Conheça como funciona a consultoria e consulte os valores diretamente comigo no WhatsApp.</span></div><p class="six">6 semanas de acompanhamento individualizado com treino e orientações para correção postural.</p>'
          )
          replace_exact('Quero%20entrar%20na%20consultoria%20VERTEX%20(R%24149%20%2F%206%20semanas).',
                        'Quero%20conhecer%20os%20valores%20e%20as%20condi%C3%A7%C3%B5es%20do%20M%C3%A9todo%20VERTEX.')
          replace_exact('Quero entrar agora</a>', 'Consultar valores no WhatsApp</a>')
          replace_exact('<p>Pix ou cartão. Você finaliza direto com o João.</p>',
                        '<p>Converse comigo no WhatsApp para conhecer os valores e esclarecer suas dúvidas.</p>')
          replace_exact('<details><summary>Quando posso falar com o João?</summary><p>Todos os dias, a qualquer momento, pelo WhatsApp.</p></details>',
                        '<details><summary>Vou ter acompanhamento direto?</summary><p>Sim. Vou acompanhar sua evolução e orientar seus ajustes pelo WhatsApp, com suporte diário.</p></details>')
          replace_exact('<details><summary>Como faço o pagamento?</summary><p>Por Pix ou cartão.</p></details>',
                        '<details><summary>Como posso saber os valores da consultoria?</summary><p>É só falar comigo pelo WhatsApp. Explico as condições e tiro suas dúvidas antes de você decidir.</p></details>')
          
          # SEO: coerência de marca e tom de voz.
          replace_exact(
           'content="Consultoria online de treino e correção postural. 6 semanas, avaliação individual e suporte diário no WhatsApp."',
           'content="Conheça o Método VERTEX: treino individualizado, evolução postural e acompanhamento diário comigo pelo WhatsApp. Consulte as condições diretamente."'
          )
          
          # Garantir que a galeria preserva apenas fotografias nítidas e SEM repetição.
          gallery=re.search(r'<div class="gal gal-alunos gallery-hq">([\s\S]*?)</div>', html)
          if not gallery:
              raise RuntimeError("A galeria de alunos atual não foi encontrada; atualização interrompida.")
          refs=re.findall(r'src="([^"]+)"', gallery.group(1))
          if len(refs)!=len(set(refs)) or len(refs)!=2:
              raise RuntimeError(f"Fotos de alunos repetidas ou quantidade inesperada: {refs}")
          for src in refs:
              if not src.startswith('assets/alunos/') or not Path(src).is_file() or Path(src).stat().st_size<80000:
                  raise RuntimeError(f"Imagem sem resolução satisfatória: {src}")
          if re.search(r'<img class="main"[^>]+src="assets/alunos/(aluno-cadeira-extensora|aluno-supino-acompanhado)',html):
              raise RuntimeError("Uma das fotos da galeria está repetida na seção sobre.")
          assert 'assets/galeria-alunos.css' in html
          
          css_file = Path('assets/vertex-review.css')
          css_file.write_text("""/* Revisão aprovada: identidade VERTEX com Funnel Display + Plus Jakarta Sans. */
          .vertex-contact-copy {display:flex;flex-direction:column;gap:16px;margin:24px 0 6px;padding:26px 0;border-top:1px solid #303030;border-bottom:1px solid #303030}
          .vertex-contact-copy strong{font-family:"Funnel Display",sans-serif;font-size:clamp(27px,3.6vw,40px);font-weight:800;line-height:1.05;color:#ffdf00;text-transform:uppercase;letter-spacing:-.02em;max-width:15ch}
          .vertex-contact-copy span{font-family:"Plus Jakarta Sans",sans-serif;color:#e9e9e9;font-size:clamp(15px,1.7vw,17px);line-height:1.55;max-width:36ch}
          .offer .panel{overflow:hidden}
          .offer .panel .btn{padding-inline:16px;text-align:center}
          @media (max-width:700px){.vertex-contact-copy{padding:22px 0}.vertex-contact-copy strong{font-size:30px}}
          """,encoding='utf-8')
          tag='<link rel="stylesheet" href="/assets/vertex-review.css">'
          if tag not in html:
              html, n=re.subn(r'</head>',tag+'\n</head>',html,count=1,flags=re.IGNORECASE)
              if n!=1:raise RuntimeError("Head não encontrada")
          path.write_text(html,encoding='utf-8')
          
          # Testes de integridade antes de publicar.
          sanitized=re.sub(r'data:image/[^;"\s]+;base64,[A-Za-z0-9+/=]+','[IMAGEM]',html)
          assert html!=original_html
          assert len(html)>100_000
          assert 'R$149' not in sanitized and 'R%24149' not in sanitized
          assert '<div class="price"' not in sanitized
          assert 'data-to="149"' not in sanitized
          assert 'class="vertex-contact-copy"' in sanitized
          assert 'Consultar valores no WhatsApp' in sanitized
          assert 'Conheça o Método VERTEX:' in sanitized
          assert 'Suporte diário' in sanitized
          assert 'assets/brand-fonts.css' in sanitized
          assert 'assets/galeria-alunos.css' in sanitized
          assert 'assets/vertex-review.css' in sanitized
          assert sanitized.count('src="assets/alunos/')==2
          print("PASSOU: sem preço público ou no WhatsApp; oferta refeita; texto do VERTEX revisado; fontes e fotos nítidas preservadas; sem duplicação.")
          print("Conteúdo atualizado no index.html, tamanho final:",len(html))
          
          PY
      - name: Publicar as mudanças e limpar auditorias
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/auditar-vertex.yml .github/workflows/revisar-vertex-cliente.yml
          git add index.html assets/vertex-review.css
          git commit -m "feat: revisar metodo VERTEX, remover preco, atualizar copy e preservar galeria"
          git push origin main
