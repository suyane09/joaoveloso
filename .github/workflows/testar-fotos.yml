name: Conferir imagens da galeria
on:
  push:
    paths: ['.github/workflows/testar-fotos.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar acesso aos arquivos e qualidade
        shell: bash
        run: |
          set -e
          URL0='https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2F69eb87ec-3606-4e68-bb4e-6684996df06c/watermark:F/width:149?csig=AAAAAAAAAAAAAAAAAAAAAKcxBk3QHu8hPq4UGFjxukWGp3P9GNP-ENOSB8Q4iuOY&exp=1793334257&osig=AAAAAAAAAAAAAAAAAAAAAMBKpYpt_OHUshYBb1lTow6lDjZNFMnQB76WGcA39i8A&signer=media-rpc&token=AAIAAU0AJDY5ZWI4N2VjLTM2MDYtNGU2OC1iYjRlLTY2ODQ5OTZkZjA2YwAAAAABoYsNJWhrqWqt6GcLZ5JynZ6HuHX0L0eqfGgZB7zXcSpRkwBTxg&x-canva-quality=thumbnail'
          URL1='https://media.canva.com/v2/image-resize/format:JPG/height:1200/quality:75/uri:ifs%3A%2F%2FM%2F69eb87ec-3606-4e68-bb4e-6684996df06c/watermark:F/width:900?csig=AAAAAAAAAAAAAAAAAAAAAKcxBk3QHu8hPq4UGFjxukWGp3P9GNP-ENOSB8Q4iuOY&exp=1793334257&osig=AAAAAAAAAAAAAAAAAAAAAMBKpYpt_OHUshYBb1lTow6lDjZNFMnQB76WGcA39i8A&signer=media-rpc&token=AAIAAU0AJDY5ZWI4N2VjLTM2MDYtNGU2OC1iYjRlLTY2ODQ5OTZkZjA2YwAAAAABoYsNJWhrqWqt6GcLZ5JynZ6HuHX0L0eqfGgZB7zXcSpRkwBTxg&x-canva-quality=thumbnail'
          URL2='https://media.canva.com/v2/image-resize/format:JPG/height:1200/quality:80/uri:ifs%3A%2F%2FM%2F69eb87ec-3606-4e68-bb4e-6684996df06c/watermark:F/width:900?csig=AAAAAAAAAAAAAAAAAAAAAKcxBk3QHu8hPq4UGFjxukWGp3P9GNP-ENOSB8Q4iuOY&exp=1793334257&osig=AAAAAAAAAAAAAAAAAAAAAMBKpYpt_OHUshYBb1lTow6lDjZNFMnQB76WGcA39i8A&signer=media-rpc&token=AAIAAU0AJDY5ZWI4N2VjLTM2MDYtNGU2OC1iYjRlLTY2ODQ5OTZkZjA2YwAAAAABoYsNJWhrqWqt6GcLZ5JynZ6HuHX0L0eqfGgZB7zXcSpRkwBTxg&x-canva-quality=thumbnail'
          for k in 0 1 2; do
            name="URL${k}"
            u="${!name}"
            http="$(curl --max-time 20 -L -sS -o "/tmp/photo-${k}.jpg" -w "%{http_code}" "$u" || true)"
            echo "variant=${k} http=${http} bytes=$(wc -c </tmp/photo-${k}.jpg) type=$(file -b /tmp/photo-${k}.jpg)"
          done
