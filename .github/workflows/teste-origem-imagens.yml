name: Testar acesso original de imagens
on:
  push:
    paths: ['.github/workflows/teste-origem-imagens.yml']
permissions:
  contents: read
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar acesso à resolução original
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, io
          sources=["https://media.canva.com/v2/image-resize/format:JPG/height:200/quality:75/uri:ifs%3A%2F%2FM%2Fcefff5e5-b2d5-4e0d-8e08-5f30fdd530e9/watermark:F/width:150?csig=AAAAAAAAAAAAAAAAAAAAAH-pjaUfrSoz4-fqTz6l8lAtL2gse9BtnUBDcwM7m7CH&exp=1793366668&osig=AAAAAAAAAAAAAAAAAAAAAL5eAMld6ZhqGFx5n9slnvCEin2AoVHS_WfpG62v76O1&signer=media-rpc&token=AAIAAU0AJGNlZmZmNWU1LWIyZDUtNGUwZC04ZTA4LTVmMzBmZGQ1MzBlOQAAAAABoYz7suAEOQudLZS6EAsXQgWdU7gjNRqabOStkUHUZuOKSoEBUA&x-canva-quality=thumbnail","https://media.canva.com/v2/image-resize/format:JPG/height:1600/quality:95/uri:ifs%3A%2F%2FM%2Fcefff5e5-b2d5-4e0d-8e08-5f30fdd530e9/watermark:F/width:1200","https://media.canva.com/v2/image-resize/format:JPG/height:1600/quality:95/uri:ifs%3A%2F%2FM%2Fcefff5e5-b2d5-4e0d-8e08-5f30fdd530e9/watermark:F/width:1200?csig=AAAAAAAAAAAAAAAAAAAAAH-pjaUfrSoz4-fqTz6l8lAtL2gse9BtnUBDcwM7m7CH&exp=1793366668&osig=AAAAAAAAAAAAAAAAAAAAAL5eAMld6ZhqGFx5n9slnvCEin2AoVHS_WfpG62v76O1&signer=media-rpc&token=AAIAAU0AJGNlZmZmNWU1LWIyZDUtNGUwZC04ZTA4LTVmMzBmZGQ1MzBlOQAAAAABoYz7suAEOQudLZS6EAsXQgWdU7gjNRqabOStkUHUZuOKSoEBUA&x-canva-quality=thumbnail"]
          for i,url in enumerate(sources):
              try:
                  r=urllib.request.urlopen(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'}),timeout=10)
                  data=r.read()
                  from PIL import Image
                  im=Image.open(io.BytesIO(data))
                  print('TEST',i,'STATUS',r.status,'SIZE',im.size,'BYTES',len(data))
              except Exception as e:
                  print('TEST',i,'ERROR',type(e).__name__,str(e)[:180])
          PY
