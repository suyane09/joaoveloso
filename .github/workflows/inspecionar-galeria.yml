name: Inspecionar galeria João Veloso
on:
  push:
    paths:
      - '.github/workflows/inspecionar-galeria.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspecionar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mostrar HTML/CSS da seção de fotos
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          data=re.compile(r'data:image/[^;"\s]+;base64,[A-Za-z0-9+/=]+')
          occurrences=[(m.start(),m.end()) for m in data.finditer(s)]
          print('DATA URI POSITIONS:',occurrences)
          clean=data.sub('[IMAGEM_BASE64]',s)
          print('HTML CLEAN FINAL 6500 CHARACTERS:',clean[-6500:])
          print('ALL IMAGES:',re.findall(r'<img[^>]*>',clean,re.I))
          for pat in ['gallery','galeria','photo','photos','mosaic','grid','frames','portfolio','showcase','.shots','.photos','.grid','object-fit']:
            for m in list(re.finditer(re.escape(pat),clean,re.I))[:8]:
              print('CSSMATCH',pat,clean[max(0,m.start()-80):m.end()+160])
          PY
