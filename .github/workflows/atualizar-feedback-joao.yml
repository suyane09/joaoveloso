name: Corrigir comentários do João Veloso
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/atualizar-feedback-joao.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter código atual
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar textos e remover seção duplicada
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          path = Path("index.html")
          s = path.read_text(encoding="utf-8")
          original = s
          def change(old, new, expected=1):
              global s
              n=s.count(old)
              if n!=expected:
                  raise RuntimeError(f"Alteração suspensa: {old[:100]!r}. Encontradas {n}, esperado {expected}.")
              s=s.replace(old,new)
          
          # Correção 1: último problema, em linguagem cuidadosa e próxima à solicitação.
          change(
              '<div><h3>O físico fica torto</h3><p>Um lado cresce mais, o ombro cai, e a estética não acompanha o esforço.</p></div>',
              '<div><h3>O físico não evolui</h3><p>Treinando com desvios posturais, a evolução pode ficar abaixo do esperado e a estética não acompanhar o seu esforço.</p></div>'
          )
          
          # Correção 2: conteúdo do acompanhamento integrado à sequência do método.
          change(
              '<div><em>1</em><h3>Avaliação</h3><p>Você recebe o guia de fotos e medidas, responde a anamnese e envia tudo online.</p></div>',
              '<div><em>1</em><h3>Avaliação</h3><p>Você me envia fotos, medidas e anamnese. Faço sua avaliação postural individual, 100% online.</p></div>'
          )
          change(
              '<div><em>2</em><h3>Análise postural</h3><p>Mapeio encurtamentos, desvios e assimetrias e separo o que é estrutural do que é funcional.</p></div>',
              '<div><em>2</em><h3>Análise postural</h3><p>Analiso encurtamentos, desvios e assimetrias para identificar o que precisa de atenção no seu corpo.</p></div>'
          )
          change(
              '<div><em>3</em><h3>Protocolo</h3><p>Alongamentos, mobilidade e treino com o volume certo para seus pontos fracos. Em PDF e plataforma de vídeos.</p></div>',
              '<div><em>3</em><h3>Protocolo</h3><p>Preparo seu treino personalizado, com mobilidade e alongamentos. Você recebe guias em PDF, vídeos explicativos e orientações de execução.</p></div>'
          )
          change(
              '<div><em>4</em><h3>Correção e ajuste</h3><p>Você envia vídeos, eu corrijo a execução. A cada 2 semanas, feedback e ajustes.</p></div>',
              '<div><em>4</em><h3>Correção e ajuste</h3><p>Você me envia vídeos para correção dos exercícios. Faço feedbacks e ajustes a cada duas semanas, com acompanhamento diário comigo pelo WhatsApp.</p></div>'
          )
          
          # Remover o bloco visual redundante inteiro, mantendo a chamada para WhatsApp após o método.
          method_start=s.find('<section class="dark" id="metodo">')
          method_end=s.find('</section>',method_start)
          assert method_start>=0 and method_end>method_start
          section=s[method_start:method_end]
          opening=re.search(r'<h2[^>]*>\s*O que está incluso no acompanhamento\s*</h2>\s*<div class="pillars">',section,re.I)
          if not opening:
              raise RuntimeError("O título e início do bloco duplicado não foram encontrados.")
          band=section.find('<div class="band">',opening.end())
          if band<0:
              raise RuntimeError("Chamada ao WhatsApp não localizada após a seção duplicada.")
          duplicated=section[opening.start():band]
          if duplicated.count('<h3>')!=6 or '<div class="pillars">' not in duplicated:
              raise RuntimeError("Estrutura inesperada no bloco duplicado; interrompido.")
          section_new=section[:opening.start()]+section[band:]
          s=s[:method_start]+section_new+s[method_end:]
          
          # Correção 3: todos os CTAs com "chamar João" ou "falar" ficam pessoais, sem alterar links.
          labels={
            '>Chamar o João no WhatsApp</a>':'>Me chame no WhatsApp</a>',
            '>Falar no WhatsApp</a>':'>Me chame no WhatsApp</a>',
            '>Falar com o João</a>':'>Fale comigo</a>'
          }
          counts={}
          for old,new in labels.items():
              n=s.count(old)
              counts[old]=n
              if old.startswith('>Chamar') and n!=1:
                  raise RuntimeError(f"Esperada a chamada final antiga uma vez, obtido {n}")
              s=s.replace(old,new)
          
          # O WhatsApp flutuante tem label curto e acessível.
          s=s.replace('aria-label="Falar no WhatsApp"','aria-label="Me chame no WhatsApp"')
          # Mantemos 'Consultar valores' para a oferta da consultoria.
          assert 'Consultar valores no WhatsApp' in s
          
          # QA de preservação e atualização.
          assert s != original
          assert '<h3>O físico não evolui</h3>' in s
          assert '<h3>O físico fica torto</h3>' not in s
          assert 'O que está incluso no acompanhamento' not in s
          assert '<div class="pillars">' not in s
          assert s.count('<div><em>') >= 4
          assert s.count('Me chame no WhatsApp') >= 2
          assert '>Chamar o João no WhatsApp</a>' not in s
          assert 'assets/brand-fonts.css' in s
          assert 'assets/galeria-alunos.css' in s
          assert 'Consultoria Método VERTEX' in s
          assert 'Consultar valores no WhatsApp' in s
          assert 'R$149' not in s and 'R%24149' not in s
          gallery=re.search(r'<div class="gal gal-alunos gallery-hq">([\s\S]*?)</div>',s)
          assert gallery
          images=re.findall(r'<img\b[^>]*src="([^"]+)"',gallery.group(1))
          assert len(images)==4, images
          assert len(set(images))==4
          for src in images:
              assert src.startswith('assets/alunos/')
              assert Path(src).is_file() and Path(src).stat().st_size>350000, src
          # Confirmar que o HTML não perdeu a galeria, cabeçalho, footer ou método.
          for marker in ['<section class="hero"', 'id="metodo"', 'id="sobre"', 'id="depoimentos"', 'id="oferta"', 'class="final"','<footer']:
              assert marker in s, marker
          assert 'O que está incluso no acompanhamento' in original
          assert s.count('<section')==original.count('<section')
          path.write_text(s,encoding='utf-8')
          print("CORREÇÕES APLICADAS E VERIFICADAS.")
          print("WhatsApp CTAs ajustados",counts)
          print("Quatro fotos originais sem alteração:",images)
          print("Removida a seção repetida; 4 etapas do Método VERTEX complementadas.")
          
          PY
      - name: Publicar atualização
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/atualizar-feedback-joao.yml
          git add index.html
          git diff --cached --stat
          git diff --cached --check
          git commit -m "fix: unificar método VERTEX e personalizar WhatsApp e benefícios"
          git push origin main
