name: Auditar textos VERTEX e galeria
on:
  push:
    paths: ['.github/workflows/auditar-vertex.yml']
permissions:
  contents: read
jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir textos e seletores sem expor imagens
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          s=re.sub(r'data:image/[^;"\\s]+;base64,[A-Za-z0-9+/=]+','[IMAGEM]',s)
          print('TOTAL SIZE CLEAN',len(s))
          print('=== HEAD AND CSS ===')
          h=s[:s.lower().find('</head>')+7]
          print(h[:19000])
          print('=== BODY ===')
          b=s[s.lower().find('<body'):]
          print(b[:19000])
          print('=== COUNTS ===')
          for p in ['149','R$','preço','valor','pix','cartão','joão','João','você','comigo','Método','VERTEX','dias','academia','resultado','oferta','gal']:
            print(repr(p),len(re.findall(re.escape(p),s,re.I)))
          PY
